# The Windows app. core: rules shared with the Mac app, no Windows code, tested on any OS.
[workspace]
resolver = "3"
members = ["core", "app"]

[workspace.package]
# Must match the next joint release and have a CHANGELOG.md entry.
version = "0.6.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
