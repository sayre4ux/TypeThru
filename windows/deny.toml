# cargo deny check (Windows workflow): known security advisories, licences, and package sources.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Fails on any advisory for a crate in Cargo.lock, including unmaintained and yanked crates.
yanked = "deny"
ignore = [
    # Unmaintained (archived), not a vulnerability. It reaches TypeThru only through Slint's
    # compile-time tools (slint-macros, slint-build via spin_on), so none of it is in the exe.
    # Check again when Slint updates.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: compile-time only, via Slint's macros and build script; no maintained release exists" },
    # Unmaintained, not a vulnerability; in the exe through Slint's core (dates in its date
    # picker, which TypeThru does not use). No safe upgrade exists until Slint replaces it.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained notice only, via Slint's core; no maintained release exists" },
]

[licenses]
# Permissive licences only, compatible with TypeThru's MIT licence, plus Slint's royalty-free
# licence, which asks for a "Made with Slint" credit (in Settings > Help).
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "Zlib", "LicenseRef-Slint-Royalty-free-2.0"]
confidence-threshold = 0.9

[bans]
wildcards = "deny"
# The app's link to the core crate is a path without a version; neither crate is published.
allow-wildcard-paths = true
multiple-versions = "allow"

[sources]
# crates.io only: no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
